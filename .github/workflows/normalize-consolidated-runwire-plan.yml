name: Normalize Consolidated Pathwise Plan

on:
  push:
    branches:
      - pathwise-4.1/foundation-runtime-security

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pathwise-4.1/foundation-runtime-security
      - name: Normalize canonical plan
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('docs/plans/pathwise-4.1-upload-filesystem-trust-boundary-plan.md')
          text = path.read_text()

          text = text.replace('the future process-runtime library', 'Runwire')
          text = text.replace('the future low-level process library', 'Runwire')
          text = text.replace('future process-runtime library', 'Runwire')
          text = text.replace('future low-level process library', 'Runwire')
          text = text.replace('the process library controls execution', 'Runwire controls execution')
          text = text.replace('Process runtime (only if deliberately needed)', 'Runwire (only if deliberately needed)')
          text = text.replace('A Runwire 1.0 sits beside/below Foundation/Omnibus', 'Runwire 1.0 sits beside/below Foundation/Omnibus')
          text = text.replace('Pathwise/ReqShield/Foundation/process-library ownership boundary', 'Pathwise/ReqShield/Foundation/Runwire ownership boundary')
          text = text.replace('Foundation plus the Runwire/OS', 'Foundation plus Runwire/OS')

          marker = '# Runwire execution boundary'
          if marker in text:
              before, tail = text.split(marker, 1)
              tail = tail.strip()
              tail = re.sub(r'(?m)^#\s+(\d+)\.\s+', lambda m: f'### 22.{m.group(1)} ', tail)
              tail = tail.replace('the parent plan', 'earlier sections of this plan')
              tail = tail.replace("parent-plan invariant", 'existing Pathwise invariant')
              tail = tail.replace('parent-plan', 'earlier-plan')
              tail = tail.replace('Completion gate addendum', 'Runwire boundary completion gate')
              tail = tail.replace('This addendum', 'This section').replace('the addendum', 'this section')
              tail = tail.replace('All other earlier-plan completion criteria remain unchanged.', 'All other Pathwise 4.1 completion criteria above remain unchanged.')
              text = before.rstrip() + '\n\n---\n\n## 22. Runwire execution boundary\n\n' + tail + '\n'

          path.write_text(text)
          Path('.github/workflows/normalize-consolidated-runwire-plan.yml').unlink()
          PY
      - name: Commit normalization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: normalize consolidated Pathwise 4.1 plan"
          git push origin HEAD:pathwise-4.1/foundation-runtime-security
