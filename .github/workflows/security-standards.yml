name: "Security & Standards"

on:
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches: [ "main", "master" ]
    tags: [ "v*", "[0-9]*" ]
  pull_request:
    branches: [ "main", "master", "develop", "development" ]


# Cancel superseded PR revisions; retain complete checks for the newest head.
# Push-to-main, scheduled and release-tag workflows are never cancelled here.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    uses: infocyph/phpforge/.github/workflows/release.yml@main
    permissions:
      contents: write
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

  phpforge:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    uses: infocyph/phpforge/.github/workflows/security-standards.yml@main
    with:
      fail_on_skipped_tests: true
      integration_services: '[]'
      service_topologies: '{}'
      php_extensions: "fileinfo, pcntl, posix, simplexml, xmlreader, zip"
      benchmark_composer_script: "benchmark:release"
    permissions:
      security-events: write
      actions: read
      contents: read

  windows:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    name: "Windows / PHP ${{ matrix.php }}"
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
    steps:
      - uses: actions/checkout@v7
      - name: "Set up PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          extensions: "fileinfo, simplexml, xmlreader, zip"
          coverage: none
          tools: composer:v2
      - name: "Install dependencies"
        run: composer install --no-interaction --prefer-dist
      - name: "Run platform tests"
        run: composer ic:test:code

  production-no-runwire:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    name: "Production-only installation (Runwire absent)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: "Set up PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: "fileinfo, zip"
          coverage: none
          tools: composer:v2
      - name: "Install production dependencies"
        run: composer install --no-dev --no-interaction --prefer-dist
      - name: "Verify normal operations without Runwire"
        run: |
          php -r '
          require "vendor/autoload.php";
          if (class_exists(\Infocyph\Runwire\RuntimeContext::class)) {
              fwrite(STDERR, "Runwire must not be installed as a production dependency.\n");
              exit(1);
          }
          $processor = new \Infocyph\Pathwise\StreamHandler\DownloadProcessor();
          $source = sys_get_temp_dir() . "/pathwise_prod_" . bin2hex(random_bytes(8)) . ".txt";
          try {
              file_put_contents($source, "unbound");
              $prepared = $processor->prepareDownload($source);
              if ($prepared->size !== 7) { exit(1); }
              $uploader = new \Infocyph\Pathwise\StreamHandler\UploadProcessor();
              if (!method_exists($uploader, "withRunwire")) { exit(1); }
          } finally {
              unlink($source);
          }
          '

  source-security-report:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    name: "Security report / production dependencies and source contracts"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: "fileinfo, pcntl, posix, zip"
          coverage: none
          tools: composer:v2
      - name: Install dependencies for audited lock resolution
        run: composer install --no-interaction --prefer-dist
      - name: Audit production dependencies (strict)
        run: |
          composer audit --no-dev --format=json > "$RUNNER_TEMP/pathwise-security.json"
          cat "$RUNNER_TEMP/pathwise-security.json"
      - name: Run filesystem trust-boundary and Runwire contract tests
        run: |
          vendor/bin/pest tests/Feature/ArchiveSecurityTest.php tests/Feature/UploadTrustBoundaryTest.php tests/Feature/ClamAvDaemonScannerTest.php tests/Feature/RunwireExecutionContextTest.php
      - name: Publish production dependency security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pathwise-production-security-report
          path: ${{ runner.temp }}/pathwise-security.json
          if-no-files-found: warn

  foundation-host-performance:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    name: "Foundation 3 host / matched 4.1 vs 4.2 performance"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: "fileinfo, pcntl, posix, simplexml, xmlreader, zip"
          coverage: none
          tools: composer:v2
      - name: Install identical Foundation host dependencies
        run: |
          composer install --no-interaction --prefer-dist
          composer require --dev --no-interaction --prefer-dist infocyph/foundation:3.0.1
      - name: Retrieve the immediate 4.1 release source
        run: |
          mkdir -p "$RUNNER_TEMP/pathwise41"
          git fetch --depth=1 origin refs/tags/4.1:refs/tags/4.1
          git archive 4.1 src | tar -x -C "$RUNNER_TEMP/pathwise41"
      - name: Compare matched host request throughput, tail latency and memory
        run: |
          python3 tests/Support/CompareFoundationHostPerformance.py \
            "$RUNNER_TEMP/pathwise41/src" "$PWD/src" \
            "$RUNNER_TEMP/pathwise-host-performance.json"
      - name: Publish matched host performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-host-performance
          path: ${{ runner.temp }}/pathwise-host-performance.json
          if-no-files-found: warn

  foundation-3-host:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    name: "Foundation 3.0.1 / Runwire 2.1.1 host and isolation"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: "fileinfo, pcntl, posix, simplexml, xmlreader, zip"
          coverage: none
          tools: composer:v2
      - name: Install Pathwise and exact Foundation host
        run: |
          composer install --no-interaction --prefer-dist
          composer require --dev --no-interaction --prefer-dist infocyph/foundation:3.0.1
      - name: Exercise composed Foundation and Runwire runtime
        run: php tests/Support/FoundationRunwireHost.php

  adapter-contracts:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    name: "Optional adapter contracts"
    runs-on: ubuntu-latest
    env:
      PATHWISE_REQUIRE_ADAPTER_CONTRACTS: "1"
    steps:
      - uses: actions/checkout@v7
      - name: "Set up PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: "fileinfo, simplexml, xmlreader, zip"
          coverage: none
          tools: composer:v2
      - name: "Install project and contract adapters"
        run: |
          composer install --no-interaction --prefer-dist
          composer require --dev --no-interaction --prefer-dist league/flysystem-memory:^3 league/flysystem-read-only:^3 league/flysystem-path-prefixing:^3
      - name: "Run adapter contracts"
        run: composer ic:test:code

  release-stress:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    name: "Release stress / PHP 8.4"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: "Set up PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: "fileinfo, pcntl, posix, simplexml, xmlreader, zip"
          coverage: none
          tools: composer:v2
      - name: "Install dependencies"
        run: composer install --no-interaction --prefer-dist
      - name: "Run release stress workloads"
        run: composer stress:release
