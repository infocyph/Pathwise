name: "Security & Standards"

on:
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master", "develop", "development" ]

jobs:
  phpforge:
    uses: infocyph/phpforge/.github/workflows/security-standards.yml@main
    with:
      fail_on_skipped_tests: true
      integration_services: '[]'
      service_topologies: '{}'
      php_extensions: "fileinfo, pcntl, posix, simplexml, xmlreader, zip"
    permissions:
      security-events: write
      actions: read
      contents: read

  documentation:
    name: "Documentation / Sphinx"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: docs/requirements.txt
      - name: "Install documentation dependencies"
        run: python -m pip install --disable-pip-version-check -r docs/requirements.txt
      - name: "Build documentation with warnings as errors"
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html

  windows:
    name: "Windows / PHP ${{ matrix.php }}"
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4
      - name: "Set up PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          extensions: "fileinfo, simplexml, xmlreader, zip"
          coverage: none
          tools: composer:v2
      - name: "Install dependencies"
        run: composer install --no-interaction --prefer-dist
      - name: "Run platform tests"
        run: composer ic:test:code

  adapter-contracts:
    name: "Optional adapter contracts"
    runs-on: ubuntu-latest
    env:
      PATHWISE_REQUIRE_ADAPTER_CONTRACTS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: "Set up PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: "fileinfo, simplexml, xmlreader, zip"
          coverage: none
          tools: composer:v2
      - name: "Install project and contract adapters"
        run: |
          composer install --no-interaction --prefer-dist
          composer require --dev --no-interaction --prefer-dist league/flysystem-memory:^3 league/flysystem-read-only:^3 league/flysystem-path-prefixing:^3
      - name: "Run adapter contracts"
        run: composer ic:test:code
