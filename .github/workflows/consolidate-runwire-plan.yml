name: Consolidate Pathwise Runwire Plan

on:
  push:
    branches:
      - pathwise-4.1/foundation-runtime-security

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pathwise-4.1/foundation-runtime-security
      - name: Consolidate plan files
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          main = Path('docs/plans/pathwise-4.1-upload-filesystem-trust-boundary-plan.md')
          addendum = Path('docs/plans/pathwise-4.1-runwire-boundary-addendum.md')
          text = main.read_text()
          extra = addendum.read_text()
          parts = extra.split('\n---\n', 1)
          body = (parts[1] if len(parts) == 2 else extra).strip()

          text = text.replace('future process library', 'Runwire 1.0')
          text = text.replace('future low-level process library', 'Runwire 1.0')
          text = text.replace('ProcessGuard', 'Runwire')
          text = text.rstrip() + '\n\n---\n\n# Runwire execution boundary\n\n' + body + '\n'
          text = text.replace('This addendum', 'This section').replace('the addendum', 'this section')
          main.write_text(text)

          addendum.unlink()
          Path('.github/workflows/consolidate-runwire-plan.yml').unlink()
          PY
      - name: Commit consolidation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: consolidate Pathwise 4.1 Runwire boundary"
          git push origin HEAD:pathwise-4.1/foundation-runtime-security
